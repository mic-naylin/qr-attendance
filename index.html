<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIC実習生 QR出欠チェック</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  // ▼ Googleの外（GitHub Pagesなど）でこのファイルを使う場合だけ、ウェブアプリのURL（…/exec）を入れてください。
  //   Apps Scriptのウェブアプリとして開く場合は空のままでOKです。
  const API_URL = "https://script.google.com/macros/s/AKfycby5NALG9UC50ShMbABfP9Mdd84gHAjZUoscxRIS7ELyuY2bUKprFjUQF0J1epgh9zGZlQ/exec";
</script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e4e7ec;--ok:#12805c;--okbg:#e7f6ef;--warn:#b54708;--warnbg:#fef3e6;--ng:#b42318;--ngbg:#fdecea;--acc:#1f4e78}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{background:var(--acc);color:#fff;padding:10px 14px}
header h1{margin:0;font-size:17px;font-weight:700}
header .st{font-size:12px;opacity:.85;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
input[type=date],select{width:100%;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
#scanner{position:relative;border-radius:12px;overflow:hidden;background:#111;aspect-ratio:4/3}
#cam{width:100%;height:100%;object-fit:cover;display:block}
#scanner .frame{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
#scanner .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
#startBox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
#startBox button{font-size:19px;font-weight:700;padding:16px 26px;border:0;border-radius:12px;background:#fff;color:var(--acc)}
#startBox p{margin:0;font-size:13px;opacity:.9;line-height:1.6}
#flash{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-weight:700;font-size:22px;color:#fff}
#flash small{display:block;font-size:14px;font-weight:400;margin-top:6px}
#flash.ok{display:flex;background:rgba(18,128,92,.92)}
#flash.warn{display:flex;background:rgba(181,71,8,.92)}
#flash.ng{display:flex;background:rgba(180,35,24,.92)}
#pick{display:none;margin-top:8px;gap:8px}
#pick button{flex:1;padding:12px;font-size:15px;border:1px solid var(--warn);background:#fff;color:var(--warn);border-radius:8px}
#last{margin-top:8px;font-size:13px;color:var(--sub);min-height:1em}
.ctrl{display:flex;gap:8px;margin-top:8px}
.ctrl button{flex:1;padding:10px;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink)}
#file{display:none}
.stats{display:flex;gap:8px}
.stat{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--bg)}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:10px 0 6px}
.tabs button{flex:1;padding:8px;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .nm{flex:1;min-width:0}
li .nm b{display:block;font-size:15px;overflow-wrap:anywhere}
li .nm span{font-size:12px;color:var(--sub)}
.chip{font-size:12px;padding:4px 8px;border-radius:99px;white-space:nowrap}
.chip.p{background:var(--okbg);color:var(--ok)}
.chip.a{background:var(--bg);color:var(--sub)}
li button{font-size:13px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);white-space:nowrap}
li.conf{background:var(--warnbg)}
.note{font-size:12px;color:var(--sub);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>MIC実習生 QR出欠チェック</h1>
  <div class="st" id="conn">読み込み中…</div>
</header>
<main>
  <div class="card">
    <div class="row">
      <div><label class="f" for="date">日付</label><input type="date" id="date"></div>
      <div><label class="f" for="cohort">期生</label><select id="cohort"><option value="">全期生</option></select></div>
    </div>
  </div>

  <div class="card">
    <div id="scanner">
      <video id="cam" playsinline muted autoplay></video>
      <div class="frame" id="frame" style="display:none"></div>
      <div class="hint" id="hint" style="display:none">枠の中にQRコードを映してください</div>
      <div id="startBox">
        <button type="button" id="startBtn">📷 スキャン開始</button>
        <p id="startMsg">カメラの使用を求められたら「許可」を押してください</p>
      </div>
      <div id="flash"></div>
    </div>
    <div id="pick" class="row"></div>
    <div id="last"></div>
    <div class="ctrl">
      <button type="button" id="stopBtn" style="display:none">⏸ 一時停止</button>
      <button type="button" id="soundBtn">🔊 音あり</button>
      <button type="button" id="photoBtn" style="display:none">📷 写真で読み取る</button>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment">
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="nP">0</b><span>出席</span></div>
      <div class="stat"><b id="nA">0</b><span>未出席</span></div>
      <div class="stat"><b id="nT">0</b><span>対象者</span></div>
    </div>
    <div class="tabs">
      <button type="button" data-f="all" class="on">全員</button>
      <button type="button" data-f="a">未出席</button>
      <button type="button" data-f="p">出席</button>
    </div>
    <ul id="list"></ul>
    <p class="note" style="margin:8px 0 0">手動で出席・取消をするときは右のボタンを押してください（取消は2回押しで確定）。何台のスマホからでも同時に使え、記録はスプレッドシートに保存されます。</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const norm = s => String(s).normalize("NFKC").replace(/\s+/g, " ").trim().toUpperCase();
const dateEl = $("date"), cohortEl = $("cohort");
let PEOPLE = [], COHORTS = [], marks = [], filter = "all", confirmKey = null, busy = 0, pollTimer = null, reqSeq = 0;

function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
dateEl.value = today();

// ---- サーバー呼び出し（Apps Script内 / 外部ホスト両対応） ----
const IN_GAS = !!(window.google && google.script && google.script.run);
function call(fn, ...args) {
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (!API_URL) return Promise.reject(new Error("API_URL未設定"));
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) })
    .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); return j.result; });
}

const keyOf = (cohort, name) => cohort + "|" + norm(name);
function markOf(p) { return marks.find(m => keyOf(m.cohort, m.name) === keyOf(p.cohort, p.name)); }
function setConn(t) { $("conn").textContent = t; }

async function load(first) {
  const seq = ++reqSeq, date = dateEl.value;
  try {
    const d = await call("getData", date);
    if (seq !== reqSeq || date !== dateEl.value) return;
    if (first || d.roster.length !== PEOPLE.length) setRoster(d.roster);
    marks = d.marks;
    setConn("同期中 ・ 他の端末の読み取りも数秒で反映されます");
    render();
  } catch (e) { setConn(!IN_GAS && !API_URL ? "API_URLが設定されていません" : "接続できません。通信状況を確認してください"); }
}
function setRoster(r) {
  PEOPLE = r.map(p => ({ ...p, key: norm(p.name) }));
  COHORTS = [...new Set(PEOPLE.map(p => p.cohort))];
  let cur = cohortEl.value;
  if (!cur) { try { cur = localStorage.getItem("att_cohort") || ""; } catch (e) {} }
  cohortEl.textContent = "";
  const o = document.createElement("option"); o.value = ""; o.textContent = "全期生"; cohortEl.append(o);
  for (const c of COHORTS) { const x = document.createElement("option"); x.value = c; x.textContent = c; cohortEl.append(x); }
  cohortEl.value = COHORTS.includes(cur) ? cur : "";
}
function startPoll() { clearInterval(pollTimer); pollTimer = setInterval(() => { if (!busy && !document.hidden) load(false); }, 5000); }

function targets() { const c = cohortEl.value; return PEOPLE.filter(p => !c || p.cohort === c); }
function render() {
  const ts = targets(); let np = 0;
  const ul = $("list"); ul.textContent = "";
  for (const p of ts) {
    const m = markOf(p); if (m) np++;
    if (filter === "p" && !m) continue;
    if (filter === "a" && m) continue;
    const k = keyOf(p.cohort, p.name);
    const li = document.createElement("li"); if (confirmKey === k) li.className = "conf";
    const nm = document.createElement("div"); nm.className = "nm";
    const b = document.createElement("b"); b.textContent = p.name;
    const s = document.createElement("span");
    s.textContent = (cohortEl.value ? "" : p.cohort + " ・ ") + "No." + p.no + (m ? " ・ " + m.time + (m.method === "手動" ? "（手動）" : "") : "");
    nm.append(b, s);
    const chip = document.createElement("span"); chip.className = "chip " + (m ? "p" : "a"); chip.textContent = m ? "出席" : "未出席";
    const btn = document.createElement("button"); btn.type = "button";
    btn.textContent = m ? (confirmKey === k ? "取消する" : "取消") : "出席にする";
    btn.onclick = () => m ? cancelMark(p, k) : addMark(p, "manual");
    li.append(nm, chip, btn); ul.append(li);
  }
  $("nP").textContent = np; $("nA").textContent = ts.length - np; $("nT").textContent = ts.length;
}

// ---- 結果表示（カメラ画面に重ねて表示） ----
let flashTimer = null, soundOn = true, actx = null;
function beep(kind) {
  if (!soundOn || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = kind === "ok" ? 1200 : 400; o.type = "sine";
    g.gain.setValueAtTime(0.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (kind === "ok" ? 0.15 : 0.35));
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.4);
  } catch (e) {}
}
function showResult(kind, title, sub) {
  const f = $("flash"); f.className = kind; f.textContent = title;
  if (sub) { const s = document.createElement("small"); s.textContent = sub; f.append(s); }
  const l = $("last"); l.textContent = "直前：" + title + (sub ? "（" + sub + "）" : "");
  beep(kind);
  try { if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 80 : [60, 60, 60]); } catch (e) {}
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.className = ""; f.textContent = ""; }, kind === "ok" ? 1300 : 2200);
}

async function addMark(p, method) {
  busy++;
  try {
    const r = await call("addMark", dateEl.value, p.cohort, p.no, p.name, method);
    marks = r.marks; render();
    if (r.status === "dup") showResult("warn", "読み取り済み：" + p.name, p.cohort + " ・ " + r.time + " に出席済み");
    else showResult("ok", "✓ " + p.name, p.cohort + " ・ 出席 " + r.time);
  } catch (e) { showResult("ng", "保存に失敗しました", "もう一度読み取ってください"); }
  finally { busy--; }
}
async function cancelMark(p, k) {
  if (confirmKey !== k) { confirmKey = k; render(); setTimeout(() => { if (confirmKey === k) { confirmKey = null; render(); } }, 4000); return; }
  confirmKey = null; busy++;
  try { const r = await call("removeMark", dateEl.value, p.cohort, p.name); marks = r.marks; render(); }
  catch (e) { showResult("ng", "取消に失敗しました"); }
  finally { busy--; }
}

let picking = false;
function handleText(text) {
  if (picking) return;
  const key = norm(text);
  let cands = PEOPLE.filter(p => p.key === key);
  const c = cohortEl.value;
  if (c) {
    const inC = cands.filter(p => p.cohort === c);
    if (!inC.length) { showResult("ng", "名簿にありません", cands.length ? text + " は " + cands.map(p => p.cohort).join("・") + " です" : text); return; }
    cands = inC;
  }
  if (!cands.length) { showResult("ng", "名簿にありません", text); return; }
  if (cands.length > 1) {
    picking = true;
    showResult("warn", text, "複数の期生にいます。下で選んでください");
    const pk = $("pick"); pk.textContent = ""; pk.style.display = "flex";
    for (const p of cands) { const b = document.createElement("button"); b.type = "button"; b.textContent = p.cohort; b.onclick = () => { pk.style.display = "none"; picking = false; record(p); }; pk.append(b); }
    return;
  }
  record(cands[0]);
}
function record(p) {
  const m = markOf(p);
  if (m) { showResult("warn", "読み取り済み：" + p.name, p.cohort + " ・ " + m.time + " に出席済み"); return; }
  addMark(p, "qr");
}

// ---- QR検出 ----
let detector = null;
if ("BarcodeDetector" in window) { try { detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; } }
async function detect(cv, ctx, w, h, inv) {
  if (detector) { try { const r = await detector.detect(cv); if (r && r.length) return r[0].rawValue; } catch (e) {} }
  if (typeof jsQR !== "function") return null;
  const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: inv });
  return r && r.data ? r.data : null;
}

// ---- スキャン（カメラを向けるだけ） ----
let stream = null, scanning = false, lastText = "", lastAt = 0;
const cv = document.createElement("canvas"), cctx = cv.getContext("2d", { willReadFrequently: true });
async function startScan() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") await actx.resume(); } catch (e) {}
  $("startMsg").textContent = "カメラを起動しています…";
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  } catch (e) {
    $("startMsg").textContent = (e && e.name === "NotAllowedError")
      ? "カメラが許可されていません。ブラウザの設定でカメラを許可してから、もう一度押してください。"
      : "この画面ではカメラを起動できませんでした。下の「写真で読み取る」をお使いください。";
    $("photoBtn").style.display = "block";
    return;
  }
  const v = $("cam"); v.srcObject = stream; await v.play().catch(() => {});
  $("startBox").style.display = "none"; $("frame").style.display = "block"; $("hint").style.display = "block";
  $("stopBtn").style.display = "block"; $("stopBtn").textContent = "⏸ 一時停止";
  scanning = true; loop();
}
function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("startBox").style.display = "flex"; $("startBtn").textContent = "📷 スキャン再開"; $("startMsg").textContent = "";
  $("frame").style.display = "none"; $("hint").style.display = "none"; $("stopBtn").style.display = "none";
}
async function loop() {
  if (!scanning) return;
  const v = $("cam");
  if (v.videoWidth && !busy && !picking && !$("flash").className) {
    // 中央部分を切り出して解析（小さいQRでも読みやすくする）
    const vw = v.videoWidth, vh = v.videoHeight, side = Math.min(vw, vh) * 0.75;
    const sx = (vw - side) / 2, sy = (vh - side) / 2, out = Math.min(720, side);
    cv.width = cv.height = out;
    cctx.drawImage(v, sx, sy, side, side, 0, 0, out, out);
    let t = await detect(cv, cctx, out, out, "dontInvert");
    if (t) {
      const now = Date.now();
      if (!(t === lastText && now - lastAt < 10000)) { lastText = t; lastAt = now; handleText(t); }
    }
  }
  setTimeout(loop, 150);
}
$("startBtn").onclick = startScan;
$("stopBtn").onclick = stopScan;
$("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = soundOn ? "🔊 音あり" : "🔇 音なし"; };
document.addEventListener("visibilitychange", () => { if (document.hidden && stream) stopScan(); });

// ---- 予備：写真で読み取る ----
$("photoBtn").onclick = () => { $("file").value = ""; $("file").click(); };
$("file").onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const img = await (window.createImageBitmap ? createImageBitmap(f, { imageOrientation: "from-image" }) : new Promise((res, rej) => { const u = URL.createObjectURL(f); const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }));
    let t = null;
    for (const max of [1600, 1000, 2400]) {
      const sc = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c2 = document.createElement("canvas"); c2.width = w; c2.height = h; const x = c2.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
      t = await detect(c2, x, w, h, "attemptBoth"); if (t) break;
    }
    if (t) handleText(t); else showResult("ng", "QRコードが見つかりません", "近づいて撮り直してください");
  } catch (err) { showResult("ng", "画像を読み込めませんでした"); }
};

dateEl.onchange = () => { marks = []; render(); load(false); };
cohortEl.onchange = () => { try { localStorage.setItem("att_cohort", cohortEl.value); } catch (e) {} render(); };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); filter = b.dataset.f; render();
});

load(true); startPoll();
</script>
</body>
</html>
